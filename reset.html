<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Hank’s BBQ</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
  <style>
    body.shop{min-height:100vh;display:grid;place-items:center;background:var(--coal);padding:24px}
    .reset-card{position:static;opacity:1;pointer-events:auto;transform:none;display:block;width:min(440px,100%);padding:0;border:0;border-radius:14px;background:#fff;overflow:hidden}
    .reset-top{background:var(--coal-2);padding:22px;text-align:center;border-bottom:4px solid var(--flame)}
    .reset-top img{height:64px}
    .reset-body{padding:30px 34px 32px}
  </style>
</head>
<body class="shop">
  <div class="modal auth reset-card">
    <div class="reset-top"><a href="index.html"><img src="img/logo.png" alt="Hank’s BBQ"></a></div>
    <div class="auth-main reset-body">
      <h2>Choose a new password</h2>
      <p class="auth-sub" id="sub">Pick something you have not used before.</p>
      <form id="form" novalidate>
        <div class="fld"><label for="p1">New password</label><div class="pw"><input id="p1" type="password" autocomplete="new-password" placeholder="Create a password"><button type="button" data-eye>Show</button></div><div class="auth-help">At least 8 characters, with letters and numbers.</div></div>
        <div class="fld"><label for="p2">Confirm new password</label><input id="p2" type="password" autocomplete="new-password" placeholder="Repeat the password"></div>
        <div class="auth-msg err" id="err" role="alert"></div>
        <div class="auth-msg ok hidden" id="ok" role="status"></div>
        <button class="auth-submit" id="go" type="submit">Save new password</button>
      </form>
      <p class="auth-switch"><a class="auth-link" href="index.html">Back to Hank’s BBQ</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const err = $("#err");
    if (!token) { err.textContent = "This reset link is missing its code. Request a new one from the sign in screen."; $("#go").disabled = true; }
    $("[data-eye]").onclick = (e) => { const f = $("#p1"), show = f.type === "password"; f.type = show ? "text" : "password"; e.target.textContent = show ? "Hide" : "Show"; };
    $("#form").addEventListener("submit", async (ev) => {
      ev.preventDefault(); err.textContent = "";
      const p1 = $("#p1").value, p2 = $("#p2").value;
      if (!(p1.length >= 8 && /[A-Za-z]/.test(p1) && /\d/.test(p1))) { err.textContent = "Use at least 8 characters, with letters and numbers."; return; }
      if (p1 !== p2) { err.textContent = "The two passwords do not match."; return; }
      $("#go").disabled = true;
      try {
        await api("/reset-password", { method: "POST", auth: false, body: { token, password: p1 } });
        $("#form").querySelectorAll(".fld").forEach((f) => f.classList.add("hidden"));
        $("#go").classList.add("hidden");
        const ok = $("#ok"); ok.textContent = "Your password has been changed. You can sign in now."; ok.classList.remove("hidden");
      } catch (e) { err.textContent = e.message; $("#go").disabled = false; }
    });
  </script>
</body>
</html>
